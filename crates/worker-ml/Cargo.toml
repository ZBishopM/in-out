[package]
name = "worker-ml"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cron worker: pull wishlist from MercadoLibre, snapshot prices + seller signals into Postgres."

[dependencies]
in_out_core.workspace = true
ml-client.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }
# native-tls -> SChannel on Windows / OpenSSL on Linux; no extra build tools.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "chrono",
    "uuid",
] }
