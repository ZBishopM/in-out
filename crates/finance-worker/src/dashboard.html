<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>in_out — finanzas</title>
<style>
  :root {
    --bg:#201916; --panel:#241d1a; --line:#3a2e26;
    --fg:#efe4d8; --muted:#a89a8b; --out:#d98c6b; --in:#a9bb8b; --accent:#e6a15c;
    --amber-glow:#f4bd7e; --terra:#cd7f59;
    --sh-dark:#120c09; --sh-light:#34281f; --r:18px;
  }
  * { box-sizing: border-box; }
  body { margin:0; color:var(--fg); font-family: system-ui, "Cantarell", "Segoe UI", sans-serif;
    background: radial-gradient(130% 80% at 50% -10%, #2b221d 0%, #221b17 55%, #1e1714 100%); min-height:100vh; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 1.75rem 1.25rem 3rem; }
  h1 { font-size: 1.5rem; font-weight:750; letter-spacing:-.02em; margin: 0 0 .1rem; }
  h1::before { content:'in_out'; display:block; font-size:.68rem; font-weight:700; letter-spacing:.28em; text-transform:uppercase; color:var(--accent); margin-bottom:.35rem; }
  .sub { color: var(--muted); font-size: .8rem; margin: 0 0 1.6rem; }

  .tiles { display:grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap:1rem; margin-bottom:1.75rem; }
  .tile { background:var(--panel); border-radius:var(--r); padding:1rem 1.15rem;
    box-shadow:6px 6px 13px var(--sh-dark), -6px -6px 13px var(--sh-light); }
  .tile .k { font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.12em; }
  .tile .v { font-size:1.6rem; font-weight:750; margin-top:.25rem; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .v.out { color:var(--out); } .v.in { color:var(--in); }

  section { background:var(--panel); border-radius:var(--r); padding:1.15rem 1.25rem; margin-bottom:1.5rem;
    box-shadow:6px 6px 13px var(--sh-dark), -6px -6px 13px var(--sh-light); }
  h2 { font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:0 0 1rem; }

  .bars { display:flex; align-items:flex-end; gap:5px; height:150px; overflow-x:auto; padding-bottom:.25rem; }
  .bar { flex:1 0 14px; min-width:14px; height:100%; background:#1b1310; border-radius:6px; position:relative; display:flex; align-items:flex-end;
    box-shadow: inset 2px 2px 5px var(--sh-dark); }
  .bar > i { display:block; width:100%; border-radius:6px;
    background:linear-gradient(180deg,var(--amber-glow),var(--accent) 55%,var(--terra));
    box-shadow:0 0 10px -2px var(--amber-glow); }
  .bar:hover::after { content: attr(data-label); position:absolute; bottom:100%; left:50%; transform:translateX(-50%); white-space:nowrap; background:#140f0c; color:var(--fg); font-size:.7rem; padding:3px 7px; border-radius:7px; margin-bottom:5px; box-shadow:3px 3px 7px var(--sh-dark); }
  .xlabels { display:flex; gap:5px; margin-top:.35rem; }
  .xlabels span { flex:1 0 14px; min-width:14px; text-align:center; font-size:.6rem; color:var(--muted); }

  table { width:100%; border-collapse:collapse; font-size:.85rem; }
  th, td { text-align:left; padding:.55rem .4rem; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; }
  td.amt { text-align:right; font-variant-numeric:tabular-nums; font-weight:700; }
  .amt.out { color:var(--out); } .amt.in { color:var(--in); }

  .catrow { display:grid; grid-template-columns:120px 1fr auto; align-items:center; gap:.7rem; padding:.4rem 0; }
  .catrow .cn { font-size:.85rem; }
  .catrow .track { background:#1b1310; border-radius:999px; height:15px; overflow:hidden; box-shadow:inset 2px 2px 4px var(--sh-dark); }
  .catrow .fill { height:100%; border-radius:999px; background:linear-gradient(90deg,var(--terra),var(--accent)); box-shadow:0 0 10px -2px var(--amber-glow); }
  .catrow .ca { font-variant-numeric:tabular-nums; font-weight:700; font-size:.85rem; }

  .acct { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; padding:.65rem 0; border-bottom:1px solid var(--line); gap:.5rem; }
  .acct-main { min-width:0; }
  .acct .n { font-weight:650; } .acct .kind { color:var(--muted); font-size:.75rem; }
  .acct-right { display:flex; align-items:center; gap:.7rem; font-variant-numeric:tabular-nums; font-weight:700; }
  .edit-toggle { background:var(--panel); color:var(--muted); border:none; border-radius:999px; padding:.28rem .7rem; font-size:.7rem; cursor:pointer; box-shadow:3px 3px 6px var(--sh-dark), -3px -3px 6px var(--sh-light); }
  .acct-edit, .acct-add { flex-basis:100%; display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.6rem; align-items:center; }
  .acct-edit[hidden] { display:none; }
  .acct-edit input, .acct-add input, .acct-edit select, .acct-add select { background:var(--bg); color:var(--fg); border:none; border-radius:11px; padding:.45rem .55rem; font-size:.8rem; width:9rem;
    box-shadow: inset 3px 3px 6px var(--sh-dark), inset -3px -3px 6px var(--sh-light); }
  .acct-edit .e-save, .acct-add button { background:var(--panel); color:var(--accent); border:none; border-radius:11px; padding:.45rem .85rem; font-size:.78rem; font-weight:650; cursor:pointer; width:auto;
    box-shadow:4px 4px 8px var(--sh-dark), -4px -4px 8px var(--sh-light); }
  .acct-edit .e-save:active, .acct-add button:active { box-shadow: inset 3px 3px 6px var(--sh-dark), inset -3px -3px 6px var(--sh-light); }
  .acct-edit .e-del { background:transparent; color:var(--out); border:1px solid var(--out); border-radius:11px; padding:.45rem .85rem; font-size:.78rem; cursor:pointer; width:auto; }
  .acct-add { border-top:1px solid var(--line); padding-top:.85rem; margin-top:.85rem; }
  .neg { color:var(--out); } .pos { color:var(--in); }
  .err { color:var(--out); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>finanzas</h1>
  <p class="sub" id="sub">cargando…</p>

  <div class="tiles" id="tiles"></div>

  <section>
    <h2>Gasto por día (S/, últimos 30)</h2>
    <div class="bars" id="daybars"></div>
    <div class="xlabels" id="daylabels"></div>
  </section>

  <section>
    <h2>Gasto por hora (S/)</h2>
    <div class="bars" id="hourbars"></div>
    <div class="xlabels" id="hourlabels"></div>
  </section>

  <section>
    <h2>Gasto por categoría (S/)</h2>
    <div id="cats"></div>
  </section>

  <section>
    <h2>Cuentas</h2>
    <div id="accounts"></div>
    <div class="acct-add">
      <input id="add-name" placeholder="nombre (ej. BCP Ahorro Soles)" />
      <input id="add-kind" placeholder="tipo (débito/crédito/ahorro)" />
      <select id="add-cur"><option>PEN</option><option>USD</option></select>
      <input id="add-limit" type="number" step="0.01" placeholder="línea (tarjeta)" />
      <input id="add-trea" type="number" step="0.01" placeholder="TREA %" />
      <button id="add-btn">+ Agregar cuenta</button>
    </div>
  </section>

  <section>
    <h2>Últimas transacciones</h2>
    <table><thead><tr><th>Fecha</th><th>Comercio</th><th style="text-align:right">Monto</th></tr></thead>
    <tbody id="txs"></tbody></table>
  </section>
</div>

<script>
const sym = c => c === 'USD' ? '$' : 'S/';
const money = (cents, c='PEN') => sym(c) + ' ' + (cents/100).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const get = async p => { const r = await fetch(p); if(!r.ok) throw new Error(p+' → '+r.status); return r.json(); };

async function postJSON(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(url + ' → ' + r.status);
  return r.json();
}
const escAttr = s => String(s).replace(/"/g, '&quot;');
const curOpts = cur => ['PEN', 'USD'].map(c => `<option ${c === cur ? 'selected' : ''}>${c}</option>`).join('');
const centsToUnit = c => (c == null ? '' : c / 100);

function acctExtra(a) {
  if (a.credit_limit_cents != null) {
    const used = Math.max(0, -a.balance_cents);
    const avail = a.credit_limit_cents + a.balance_cents;
    return `<div class="kind">Usado ${money(used, a.currency)} · Disp. ${money(avail, a.currency)} · Línea ${money(a.credit_limit_cents, a.currency)}</div>`;
  }
  if (a.trea_bps != null) return `<div class="kind">TREA ${(a.trea_bps / 100).toFixed(2)}%</div>`;
  return '';
}

function renderAccounts(accounts) {
  const el = document.getElementById('accounts');
  el.innerHTML = accounts.map(a => `
    <div class="acct">
      <div class="acct-main">
        <div class="n">${a.name}</div>
        <div class="kind">${a.kind} · ${a.currency}</div>
        ${acctExtra(a)}
      </div>
      <div class="acct-right">
        <span class="${a.balance_cents < 0 ? 'neg' : 'pos'}">${money(a.balance_cents, a.currency)}</span>
        <button class="edit-toggle" data-id="${a.id}">editar</button>
      </div>
      <div class="acct-edit" id="edit-${a.id}" hidden>
        <input class="e-name" value="${escAttr(a.name)}" placeholder="nombre" />
        <input class="e-kind" value="${escAttr(a.kind)}" placeholder="tipo" />
        <select class="e-cur">${curOpts(a.currency)}</select>
        <input class="e-bal" type="number" step="0.01" placeholder="saldo actual (${a.currency})" />
        <input class="e-limit" type="number" step="0.01" placeholder="línea crédito" value="${centsToUnit(a.credit_limit_cents)}" />
        <input class="e-trea" type="number" step="0.01" placeholder="TREA %" value="${a.trea_bps != null ? a.trea_bps / 100 : ''}" />
        <button class="e-save" data-id="${a.id}">guardar</button>
        <button class="e-del" data-id="${a.id}">borrar</button>
      </div>
    </div>`).join('') || '<span class="kind">sin cuentas</span>';

  el.querySelectorAll('.edit-toggle').forEach(b => b.onclick = () => {
    const ed = document.getElementById('edit-' + b.dataset.id); ed.hidden = !ed.hidden;
  });
  el.querySelectorAll('.e-save').forEach(btn => btn.onclick = async () => {
    const id = btn.dataset.id;
    const s = document.getElementById('edit-' + id);
    const txt = q => s.querySelector(q).value.trim();
    const cents = q => { const v = s.querySelector(q).value.trim(); return v === '' ? null : Math.round(parseFloat(v) * 100); };
    btn.textContent = '…';
    try {
      await postJSON('/api/accounts/update', {
        id, name: txt('.e-name'), kind: txt('.e-kind'), currency: s.querySelector('.e-cur').value,
        credit_limit_cents: cents('.e-limit'), trea_bps: cents('.e-trea')
      });
      const bal = txt('.e-bal');
      const latest = bal !== '' ? await postJSON('/api/accounts/balance', { account_id: id, current_cents: Math.round(parseFloat(bal) * 100) }) : await get('/api/accounts');
      renderAccounts(latest);
    } catch (e) { btn.textContent = 'error'; setTimeout(() => (btn.textContent = 'guardar'), 1500); }
  });
  el.querySelectorAll('.e-del').forEach(btn => btn.onclick = async () => {
    if (!confirm('¿Borrar esta cuenta? Su historial de movimientos se conserva.')) return;
    try { renderAccounts(await postJSON('/api/accounts/delete', { id: btn.dataset.id })); }
    catch (e) { btn.textContent = 'error'; }
  });
}

function wireAddAccount() {
  document.getElementById('add-btn').onclick = async () => {
    const v = id => document.getElementById(id).value.trim();
    const cents = id => { const x = v(id); return x === '' ? null : Math.round(parseFloat(x) * 100); };
    if (!v('add-name')) return;
    try {
      const latest = await postJSON('/api/accounts/create', {
        name: v('add-name'), kind: v('add-kind') || 'otros', currency: document.getElementById('add-cur').value,
        credit_limit_cents: cents('add-limit'), trea_bps: cents('add-trea')
      });
      ['add-name', 'add-kind', 'add-limit', 'add-trea'].forEach(id => (document.getElementById(id).value = ''));
      renderAccounts(latest);
    } catch (e) { document.getElementById('add-btn').textContent = 'error'; }
  };
}

function bars(elBars, elLabels, data, valueFn, labelFn, tipFn) {
  const max = Math.max(1, ...data.map(valueFn));
  elBars.innerHTML = data.map(d => {
    const h = Math.round(valueFn(d)/max*100);
    return `<div class="bar" data-label="${tipFn(d)}"><i style="height:${h}%"></i></div>`;
  }).join('');
  elLabels.innerHTML = data.map(d => `<span>${labelFn(d)}</span>`).join('');
}

async function main() {
  try {
    const [summary, daily, hourly, cats, accounts, txs] = await Promise.all([
      get('/api/summary'), get('/api/daily?days=30'), get('/api/hourly'),
      get('/api/by_category'), get('/api/accounts'), get('/api/transactions?limit=25'),
    ]);

    const find = (c,d) => (summary.find(s=>s.currency===c&&s.direction===d)||{}).total_cents||0;
    const tiles = [
      { k:'Egresos (S/)', v: money(find('PEN','out')), cls:'out' },
      { k:'Ingresos (S/)', v: money(find('PEN','in')), cls:'in' },
      { k:'PayPal (USD)', v: money(find('USD','in'),'USD'), cls:'in' },
      { k:'Neto (S/)', v: money(find('PEN','in')-find('PEN','out')), cls: find('PEN','in')-find('PEN','out')>=0?'in':'out' },
    ];
    document.getElementById('tiles').innerHTML = tiles.map(t =>
      `<div class="tile"><div class="k">${t.k}</div><div class="v ${t.cls}">${t.v}</div></div>`).join('');

    bars(document.getElementById('daybars'), document.getElementById('daylabels'),
      daily, d=>d.out_cents, d=>d.day.slice(5), d=>`${d.day}: ${money(d.out_cents)}`);

    // hours 0..23, fill gaps
    const hmap = Object.fromEntries(hourly.map(h=>[h.hour,h.out_cents]));
    const hours = Array.from({length:24},(_,i)=>({hour:i,out_cents:hmap[i]||0}));
    bars(document.getElementById('hourbars'), document.getElementById('hourlabels'),
      hours, h=>h.out_cents, h=>h.hour%3===0?String(h.hour):'', h=>`${h.hour}:00 — ${money(h.out_cents)}`);

    const cmax = Math.max(1, ...cats.map(c => c.out_cents));
    document.getElementById('cats').innerHTML = cats.map(c =>
      `<div class="catrow"><span class="cn">${c.category}</span>
       <span class="track"><span class="fill" style="width:${Math.round(c.out_cents/cmax*100)}%"></span></span>
       <span class="ca">${money(c.out_cents)}</span></div>`).join('') || '<span class="kind">sin datos</span>';

    renderAccounts(accounts);
    wireAddAccount();

    document.getElementById('txs').innerHTML = txs.map(t => {
      const d = new Date(t.occurred_at).toLocaleString('es-PE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
      const sign = t.direction==='out'?'-':'+';
      return `<tr><td>${d}</td><td>${t.merchant||'—'}</td>
        <td class="amt ${t.direction}">${sign}${money(t.amount_cents,t.currency)}</td></tr>`;
    }).join('');

    document.getElementById('sub').textContent = `${txs.length ? 'actualizado' : 'sin datos'} · ${new Date().toLocaleString('es-PE')}`;
  } catch (e) {
    document.getElementById('sub').innerHTML = `<span class="err">error: ${e.message}</span>`;
  }
}
main();
</script>
</body>
</html>
