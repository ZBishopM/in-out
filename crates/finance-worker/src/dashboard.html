<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>in_out — finanzas</title>
<style>
  :root {
    color-scheme: dark;
    /* scandinavian-design dark-canvas tokens — same set as apps/ui, kept in
       sync deliberately (see README P0-2): near-black canvas, white ink, its
       own alpha ladder (not a 1:1 flip of the light percentages). out/in
       keep real color — they're semantic state (expense vs income), which
       the skill explicitly protects from being flattened to monochrome. */
    --canvas:#0a0a0a; --panel:#0a0a0a;
    --ink:#ffffff; --ink-secondary:rgb(255 255 255 / 56%); --ink-tertiary:rgb(255 255 255 / 50%);
    --border:rgb(255 255 255 / 11%); --border-strong:rgb(255 255 255 / 18%);
    --hover-fill:rgb(255 255 255 / 9%); --pressed-fill:rgb(255 255 255 / 14%);
    --out:#ff6b57; --in:#7ad694;
    --radius:10px; --radius-pill:999px;
  }
  input, select { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; color:var(--ink); font-family: system-ui, "Segoe UI", sans-serif;
    background: var(--canvas); min-height:100vh; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 1.75rem 1.25rem 3rem; }
  h1 { font-size: 1.5rem; font-weight:600; letter-spacing:-.02em; margin: 0 0 .1rem; color:var(--ink); }
  h1::before { content:'in_out'; display:block; font-size:.72rem; font-weight:600; letter-spacing:.12em; color:var(--ink-secondary); margin-bottom:.35rem; }
  .sub { color: var(--ink-secondary); font-size: .8rem; margin: 0 0 1.6rem; }

  .tiles { display:grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap:1rem; margin-bottom:1.75rem; }
  .tile { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:1rem 1.15rem; }
  .tile .k { font-size:.68rem; color:var(--ink-secondary); letter-spacing:.04em; }
  .tile .v { font-size:1.6rem; font-weight:600; margin-top:.25rem; font-variant-numeric:tabular-nums; letter-spacing:-.01em; color:var(--ink); }
  .v.out { color:var(--out); } .v.in { color:var(--in); }

  section { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:1.15rem 1.25rem; margin-bottom:1.5rem; }
  h2 { font-size:.72rem; letter-spacing:.04em; color:var(--ink-secondary); margin:0 0 1rem; font-weight:500; }

  .bars { display:flex; align-items:flex-end; gap:5px; height:150px; overflow-x:auto; padding-bottom:.25rem; }
  .bar { flex:1 0 14px; min-width:14px; height:100%; background:transparent; border:1px solid var(--border); border-radius:6px; position:relative; display:flex; align-items:flex-end; overflow:hidden; }
  .bar > i { display:block; width:100%; border-radius:0; background:var(--ink); opacity:.8; }
  .bar:hover > i { opacity:1; }
  .xlabels { display:flex; gap:5px; margin-top:.35rem; }
  .xlabels span { flex:1 0 14px; min-width:14px; text-align:center; font-size:.6rem; color:var(--ink-tertiary); }

  table { width:100%; border-collapse:collapse; font-size:.85rem; }
  th, td { text-align:left; padding:.55rem .4rem; border-bottom:1px solid var(--border); }
  th { color:var(--ink-secondary); font-weight:500; font-size:.68rem; letter-spacing:.04em; }
  td.amt { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  .amt.out { color:var(--out); } .amt.in { color:var(--in); }

  .catrow { display:grid; grid-template-columns:120px 1fr auto; align-items:center; gap:.7rem; padding:.4rem 0; }
  .catrow .cn { font-size:.85rem; color:var(--ink-secondary); }
  .catrow .track { display:block; background:transparent; border:1px solid var(--border); border-radius:999px; height:15px; overflow:hidden; }
  .catrow .fill { display:block; height:100%; min-width:3px; border-radius:999px; background:var(--ink); opacity:.75; }
  .catrow .ca { font-variant-numeric:tabular-nums; font-weight:600; font-size:.85rem; color:var(--ink); }

  .acct { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; padding:.65rem 0; border-bottom:1px solid var(--border); gap:.5rem; }
  .acct-main { min-width:0; }
  .acct .n { font-weight:500; color:var(--ink); } .acct .kind { color:var(--ink-secondary); font-size:.75rem; }
  .acct-right { display:flex; align-items:center; gap:.7rem; font-variant-numeric:tabular-nums; font-weight:600; }
  .edit-toggle { background:transparent; color:var(--ink-secondary); border:1px solid var(--border); border-radius:var(--radius-pill); padding:.28rem .7rem; font-size:.7rem; cursor:pointer; transition:background-color .18s ease, border-color .18s ease; }
  .edit-toggle:hover { background:var(--hover-fill); border-color:var(--border-strong); }
  .acct-edit, .acct-add { flex-basis:100%; display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.6rem; align-items:center; }
  .acct-edit[hidden] { display:none; }
  .acct-edit input, .acct-add input, .acct-edit select, .acct-add select { background:transparent; color:var(--ink); border:1px solid var(--border); border-radius:var(--radius); padding:.45rem .55rem; font-size:.8rem; width:9rem; }
  .acct-edit .e-save, .acct-add button { background:transparent; color:var(--ink); border:1px solid var(--border); border-radius:var(--radius-pill); padding:.45rem .85rem; font-size:.78rem; font-weight:500; cursor:pointer; width:auto; transition:background-color .18s ease, border-color .18s ease; }
  .acct-edit .e-save:hover, .acct-add button:hover { background:var(--hover-fill); border-color:var(--border-strong); }
  .acct-edit .e-save:active, .acct-add button:active { background:var(--pressed-fill); }
  .acct-edit .e-del { background:transparent; color:var(--out); border:1px solid var(--out); border-radius:var(--radius-pill); padding:.45rem .85rem; font-size:.78rem; cursor:pointer; width:auto; }
  .acct-add { border-top:1px solid var(--border); padding-top:.85rem; margin-top:.85rem; }
  .neg { color:var(--out); } .pos { color:var(--in); }
  .err { color:var(--out); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }

  /* collapsible sections */
  .sec-head { display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none; }
  .sec-head h2 { margin:0; }
  .chev { color:var(--ink-secondary); font-size:1.15rem; line-height:1; transition:transform .3s ease; }
  section.collapsed .chev { transform:rotate(-90deg); }
  .sec-body { display:grid; grid-template-rows:1fr; grid-template-columns:minmax(0,1fr); transition:grid-template-rows .28s ease-out; margin-top:1rem; }
  section.collapsed .sec-body { grid-template-rows:0fr; margin-top:0; }
  .sec-inner { overflow:hidden; min-height:0; }

  /* entrance cascade — trimmed under 300ms per the skill's ordinary-motion ceiling */
  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  h1, .sub, .tiles, section { animation:rise .28s ease-out both; }
  h1 { animation-delay:.02s } .sub { animation-delay:.05s } .tiles { animation-delay:.08s }
  section:nth-of-type(1){animation-delay:.11s} section:nth-of-type(2){animation-delay:.14s}
  section:nth-of-type(3){animation-delay:.17s} section:nth-of-type(4){animation-delay:.2s}
  section:nth-of-type(5){animation-delay:.23s} section:nth-of-type(6){animation-delay:.26s}

  /* growth animations (scale — no rAF/inline-width dependency) */
  @keyframes growy { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes growx { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .bar > i { transform-origin: bottom; animation: growy .28s ease-out both; }
  .catrow .fill { transform-origin: left; animation: growx .28s ease-out both; }

  /* tooltip — flat panel, hairline border instead of shadow */
  #tip {
    position: fixed; z-index: 1000; pointer-events: none; white-space: nowrap;
    transform: translate(-50%, -100%) scale(.95); transform-origin: bottom center;
    background: #141414; color: var(--ink); font-size: .72rem; font-weight: 500;
    padding: .35rem .6rem; border-radius: 8px; border: 1px solid var(--border-strong);
    opacity: 0; transition: opacity .14s ease, transform .14s ease;
  }
  #tip.show { opacity: 1; transform: translate(-50%, -100%) scale(1); }

  /* hover highlights */
  tr { transition: background .15s ease; }
  tbody tr:hover { background: var(--hover-fill); }
  .tile { transition: border-color .18s ease; }
  .tile:hover { border-color: var(--border-strong); }

  /* scrollbars — neutral ink, no color cast */
  * { scrollbar-width: thin; scrollbar-color: rgb(255 255 255 / 18%) transparent; }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgb(255 255 255 / 18%); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgb(255 255 255 / 30%); background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
  .bars::-webkit-scrollbar { height: 7px; }

  @media (prefers-reduced-motion: reduce) {
    *, ::before, ::after { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>finanzas</h1>
  <p class="sub" id="sub">cargando…</p>

  <div class="tiles" id="tiles"></div>

  <section>
    <h2>Gasto por día (S/, últimos 30)</h2>
    <div class="bars" id="daybars"></div>
    <div class="xlabels" id="daylabels"></div>
  </section>

  <section>
    <h2>Gasto por hora (S/)</h2>
    <div class="bars" id="hourbars"></div>
    <div class="xlabels" id="hourlabels"></div>
  </section>

  <section>
    <h2>Gasto por categoría (S/)</h2>
    <div id="cats"></div>
  </section>

  <section>
    <h2>Cuentas</h2>
    <div id="accounts"></div>
    <div class="acct-add">
      <input id="add-name" placeholder="nombre (ej. BCP Ahorro Soles)" />
      <input id="add-kind" placeholder="tipo (débito/crédito/ahorro)" />
      <select id="add-cur"><option>PEN</option><option>USD</option></select>
      <input id="add-limit" type="number" step="0.01" placeholder="línea (tarjeta)" />
      <input id="add-trea" type="number" step="0.01" placeholder="TREA %" />
      <button id="add-btn">+ Agregar cuenta</button>
    </div>
  </section>

  <section>
    <h2>Últimas transacciones</h2>
    <table><thead><tr><th>Fecha</th><th>Comercio</th><th style="text-align:right">Monto</th></tr></thead>
    <tbody id="txs"></tbody></table>
  </section>
</div>

<script>
const sym = c => c === 'USD' ? '$' : 'S/';
const money = (cents, c='PEN') => sym(c) + ' ' + (cents/100).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const get = async p => { const r = await fetch(p); if(!r.ok) throw new Error(p+' → '+r.status); return r.json(); };

async function postJSON(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(url + ' → ' + r.status);
  return r.json();
}
const escAttr = s => String(s).replace(/"/g, '&quot;');
const curOpts = cur => ['PEN', 'USD'].map(c => `<option ${c === cur ? 'selected' : ''}>${c}</option>`).join('');
const centsToUnit = c => (c == null ? '' : c / 100);

function acctExtra(a) {
  if (a.credit_limit_cents != null) {
    const used = Math.max(0, -a.balance_cents);
    const avail = a.credit_limit_cents + a.balance_cents;
    return `<div class="kind">Usado ${money(used, a.currency)} · Disp. ${money(avail, a.currency)} · Línea ${money(a.credit_limit_cents, a.currency)}</div>`;
  }
  if (a.trea_bps != null) return `<div class="kind">TREA ${(a.trea_bps / 100).toFixed(2)}%</div>`;
  return '';
}

function renderAccounts(accounts) {
  const el = document.getElementById('accounts');
  el.innerHTML = accounts.map(a => `
    <div class="acct">
      <div class="acct-main">
        <div class="n">${a.name}</div>
        <div class="kind">${a.kind} · ${a.currency}</div>
        ${acctExtra(a)}
      </div>
      <div class="acct-right">
        <span class="${a.balance_cents < 0 ? 'neg' : 'pos'}">${money(a.balance_cents, a.currency)}</span>
        <button class="edit-toggle" data-id="${a.id}">editar</button>
      </div>
      <div class="acct-edit" id="edit-${a.id}" hidden>
        <input class="e-name" value="${escAttr(a.name)}" placeholder="nombre" />
        <input class="e-kind" value="${escAttr(a.kind)}" placeholder="tipo" />
        <select class="e-cur">${curOpts(a.currency)}</select>
        <input class="e-bal" type="number" step="0.01" placeholder="saldo actual (${a.currency})" />
        <input class="e-limit" type="number" step="0.01" placeholder="línea crédito" value="${centsToUnit(a.credit_limit_cents)}" />
        <input class="e-trea" type="number" step="0.01" placeholder="TREA %" value="${a.trea_bps != null ? a.trea_bps / 100 : ''}" />
        <button class="e-save" data-id="${a.id}">guardar</button>
        <button class="e-del" data-id="${a.id}">borrar</button>
      </div>
    </div>`).join('') || '<span class="kind">sin cuentas</span>';

  el.querySelectorAll('.edit-toggle').forEach(b => b.onclick = () => {
    const ed = document.getElementById('edit-' + b.dataset.id); ed.hidden = !ed.hidden;
  });
  el.querySelectorAll('.e-save').forEach(btn => btn.onclick = async () => {
    const id = btn.dataset.id;
    const s = document.getElementById('edit-' + id);
    const txt = q => s.querySelector(q).value.trim();
    const cents = q => { const v = s.querySelector(q).value.trim(); return v === '' ? null : Math.round(parseFloat(v) * 100); };
    btn.textContent = '…';
    try {
      await postJSON('/api/accounts/update', {
        id, name: txt('.e-name'), kind: txt('.e-kind'), currency: s.querySelector('.e-cur').value,
        credit_limit_cents: cents('.e-limit'), trea_bps: cents('.e-trea')
      });
      const bal = txt('.e-bal');
      const latest = bal !== '' ? await postJSON('/api/accounts/balance', { account_id: id, current_cents: Math.round(parseFloat(bal) * 100) }) : await get('/api/accounts');
      renderAccounts(latest);
    } catch (e) { btn.textContent = 'error'; setTimeout(() => (btn.textContent = 'guardar'), 1500); }
  });
  el.querySelectorAll('.e-del').forEach(btn => btn.onclick = async () => {
    if (!confirm('¿Borrar esta cuenta? Su historial de movimientos se conserva.')) return;
    try { renderAccounts(await postJSON('/api/accounts/delete', { id: btn.dataset.id })); }
    catch (e) { btn.textContent = 'error'; }
  });
}

function wireAddAccount() {
  document.getElementById('add-btn').onclick = async () => {
    const v = id => document.getElementById(id).value.trim();
    const cents = id => { const x = v(id); return x === '' ? null : Math.round(parseFloat(x) * 100); };
    if (!v('add-name')) return;
    try {
      const latest = await postJSON('/api/accounts/create', {
        name: v('add-name'), kind: v('add-kind') || 'otros', currency: document.getElementById('add-cur').value,
        credit_limit_cents: cents('add-limit'), trea_bps: cents('add-trea')
      });
      ['add-name', 'add-kind', 'add-limit', 'add-trea'].forEach(id => (document.getElementById(id).value = ''));
      renderAccounts(latest);
    } catch (e) { document.getElementById('add-btn').textContent = 'error'; }
  };
}

function bars(elBars, elLabels, data, valueFn, labelFn, tipFn) {
  const max = Math.max(1, ...data.map(valueFn));
  elBars.innerHTML = data.map(d => {
    const h = Math.round(valueFn(d) / max * 100);
    return `<div class="bar" data-tip="${tipFn(d)}"><i style="height:${h}%"></i></div>`;
  }).join('');
  elLabels.innerHTML = data.map(d => `<span>${labelFn(d)}</span>`).join('');
}

function countUp(el, target, cur) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = money(target, cur); return; }
  const dur = 750, t0 = performance.now();
  (function step(now) {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = money(Math.round(target * e), cur);
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

// Turn each <section> into a collapsible with a chevron; remember state.
function makeCollapsible() {
  const state = JSON.parse(localStorage.getItem('inout-collapsed') || '{}');
  document.querySelectorAll('section').forEach((sec, i) => {
    if (sec.querySelector('.sec-head')) return; // already wrapped
    const h2 = sec.querySelector('h2');
    const key = h2 ? h2.textContent.trim() : 'sec' + i;
    const head = document.createElement('div'); head.className = 'sec-head';
    const chev = document.createElement('span'); chev.className = 'chev'; chev.textContent = '⌄';
    sec.insertBefore(head, sec.firstChild);
    if (h2) head.appendChild(h2);
    head.appendChild(chev);
    const body = document.createElement('div'); body.className = 'sec-body';
    const inner = document.createElement('div'); inner.className = 'sec-inner';
    while (head.nextSibling) inner.appendChild(head.nextSibling);
    body.appendChild(inner); sec.appendChild(body);
    if (state[key]) sec.classList.add('collapsed');
    head.onclick = () => {
      sec.classList.toggle('collapsed');
      state[key] = sec.classList.contains('collapsed');
      localStorage.setItem('inout-collapsed', JSON.stringify(state));
    };
  });
}

async function main() {
  try {
    const [summary, daily, hourly, cats, accounts, txs] = await Promise.all([
      get('/api/summary'), get('/api/daily?days=30'), get('/api/hourly'),
      get('/api/by_category'), get('/api/accounts'), get('/api/transactions?limit=25'),
    ]);

    const find = (c,d) => (summary.find(s=>s.currency===c&&s.direction===d)||{}).total_cents||0;
    const net = find('PEN','in') - find('PEN','out');
    const tiles = [
      { k:'Egresos (S/)', cents: find('PEN','out'), cur:'PEN', cls:'out' },
      { k:'Ingresos (S/)', cents: find('PEN','in'), cur:'PEN', cls:'in' },
      { k:'PayPal (USD)', cents: find('USD','in'), cur:'USD', cls:'in' },
      { k:'Neto (S/)', cents: net, cur:'PEN', cls: net>=0?'in':'out' },
    ];
    document.getElementById('tiles').innerHTML = tiles.map((t,i) =>
      `<div class="tile"><div class="k">${t.k}</div><div class="v ${t.cls}" id="tile-${i}">${money(0,t.cur)}</div></div>`).join('');
    tiles.forEach((t,i) => countUp(document.getElementById('tile-'+i), t.cents, t.cur));

    bars(document.getElementById('daybars'), document.getElementById('daylabels'),
      daily, d=>d.out_cents, d=>d.day.slice(5), d=>`${d.day}: ${money(d.out_cents)}`);

    // hours 0..23, fill gaps
    const hmap = Object.fromEntries(hourly.map(h=>[h.hour,h.out_cents]));
    const hours = Array.from({length:24},(_,i)=>({hour:i,out_cents:hmap[i]||0}));
    bars(document.getElementById('hourbars'), document.getElementById('hourlabels'),
      hours, h=>h.out_cents, h=>h.hour%3===0?String(h.hour):'', h=>`${h.hour}:00 — ${money(h.out_cents)}`);

    const cmax = Math.max(1, ...cats.map(c => c.out_cents));
    document.getElementById('cats').innerHTML = cats.map(c =>
      `<div class="catrow" data-tip="${c.category}: ${money(c.out_cents)}"><span class="cn">${c.category}</span>
       <span class="track"><span class="fill" style="width:${Math.round(c.out_cents / cmax * 100)}%"></span></span>
       <span class="ca">${money(c.out_cents)}</span></div>`).join('') || '<span class="kind">sin datos</span>';

    renderAccounts(accounts);
    wireAddAccount();

    document.getElementById('txs').innerHTML = txs.map(t => {
      const d = new Date(t.occurred_at).toLocaleString('es-PE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
      const sign = t.direction==='out'?'-':'+';
      return `<tr><td>${d}</td><td>${t.merchant||'—'}</td>
        <td class="amt ${t.direction}">${sign}${money(t.amount_cents,t.currency)}</td></tr>`;
    }).join('');

    document.getElementById('sub').textContent = `${txs.length ? 'actualizado' : 'sin datos'} · ${new Date().toLocaleString('es-PE')}`;
    makeCollapsible();
  } catch (e) {
    document.getElementById('sub').innerHTML = `<span class="err">error: ${e.message}</span>`;
  }
}
function initTooltip() {
  const tip = document.createElement('div');
  tip.id = 'tip';
  document.body.appendChild(tip);
  let raf = 0, x = 0, y = 0, cur = null;
  const place = () => { raf = 0; tip.style.left = x + 'px'; tip.style.top = (y - 16) + 'px'; };
  document.addEventListener('mousemove', (e) => {
    const el = e.target.closest('[data-tip]');
    if (el) {
      const t = el.getAttribute('data-tip');
      if (t !== cur) { tip.textContent = t; cur = t; }
      x = e.clientX; y = e.clientY;
      tip.classList.add('show');
      if (!raf) raf = requestAnimationFrame(place);
    } else if (cur !== null) {
      tip.classList.remove('show'); cur = null;
    }
  }, { passive: true });
}

initTooltip();
main();
</script>
</body>
</html>
