# Lightweight stack for agapornis (Hetzner): Postgres + n8n.
#
# The full Supabase self-hosted stack (auth, REST, realtime, studio) is layered
# separately from the upstream repo — see server/README.md. This compose gives
# you a Postgres to develop against and n8n for the email ingestion workflows.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: inout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: inout
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port: reachable only inside the compose network (postgres:5432).
    # Avoids clashing with another Postgres on the host and keeps the DB private.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inout"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ingest-api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgres://inout:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/inout?sslmode=disable
      - INGEST_BIND=0.0.0.0:8090
      - INGEST_TOKEN=${INGEST_TOKEN:?set in .env}
      - INOUT_USER_ID=${INOUT_USER_ID:-00000000-0000-0000-0000-000000000001}
      - RUST_LOG=info
    depends_on:
      postgres:
        condition: service_healthy
    # n8n reaches it at http://ingest-api:8090 (docker net). Also published on
    # localhost so the host nginx can proxy the dashboard subdomain to it.
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      # TLS is terminated by the host nginx; tell n8n its public URL is https so
      # generated links + OAuth callbacks are correct.
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_EDITOR_BASE_URL=https://${N8N_HOST}/
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=America/Lima
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=inout
      - DB_POSTGRESDB_USER=inout
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:?set in .env}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:?set in .env}
    # Bind to localhost only; your reverse proxy forwards the public domain here.
    # If 5678 is also taken on the host, change the left side (e.g. 5679:5678).
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8ndata:/home/node/.n8n
    restart: unless-stopped

volumes:
  pgdata:
  n8ndata:
